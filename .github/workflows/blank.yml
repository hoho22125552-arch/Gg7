name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q 'CellHelper*'
      - run: |
          echo "android.useAndroidX=true" > CellHelper/gradle.properties
          echo "org.gradle.jvmargs=-Xmx2g" >> CellHelper/gradle.properties
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: cd CellHelper && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: CellHelper/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create v${{ github.run_number }} CellHelper/app/build/outputs/apk/debug/app-debug.apk --title "CellHelper ${{ github.run_number }}" --notes "Сборка ${{ github.run_number }}"
